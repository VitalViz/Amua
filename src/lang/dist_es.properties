# general
gen.sample = Muestra
gen.distribution_functions = Funciones de distribución
gen.moments = Momentos
gen.discrete = Discreta
gen.shape_gt0 = Forma (<font face=\"Consolas\">>0</font>)
gen.num_trials = Número de ensayos (Entero <font face=\"Consolas\">>0</font>)
gen.location = Localización
gen.scale_gt0 = Escala (<font face=\"Consolas\">>0</font>)
gen.degrees_freedom = Grados de libertad (Entero <font face=\"Consolas\">>0</font>)
gen.pos_real_num = Número real positivo
gen.real_num_gt0 = Número real <font face=\"Consolas\">>0</font>
gen.max_value = Valor máximo
gen.min_value = Valor mínimo
gen.continuous = Continua
gen.multivariate = Multivariada

# descriptions
desc.sample = Devuelve una variable aleatoria (media en caso base) de la distribución
desc.pmf = Devuelve el valor de la FMP en <font face=\"Consolas\">{0}</font>
desc.pdf = Devuelve el valor de la FDP en <font face=\"Consolas\">{0}</font>
desc.cdf = Devuelve el valor de la FDA en <font face=\"Consolas\">{0}</font>
desc.quantile = Devuelve el cuantil (FDA inversa) de la distribución en <font face=\"Consolas\">{0}</font>
desc.mean = Devuelve la media de la distribución
desc.var = Devuelve la varianza de la distribución
desc.prob_success = Probabilidad de éxito
desc.sample_rounded = Devuelve una variable aleatoria (media redondeada en caso base) de la distribución
desc.sample_median = Devuelve una variable aleatoria (mediana en caso base) de la distribución

# Bern
bern.name = Distribución de Bernoulli
bern.desc = La distribución de probabilidad de un único resultado con valor booleano
bern.support = Entero en <font face=\"Consolas\">{0,1}</font>

# Beta
beta.name = Distribución Beta
beta.desc = Una distribución continua acotada por <font face=\"Consolas\">0</font> y <font face=\"Consolas\">1</font>. A menudo usada para modelar probabilidades
beta.support = Número real en <font face=\"Consolas\">[0,1]</font>

# Bin
bin.name = Distribución Binomial
bin.desc = Usada para modelar el número de éxitos que ocurren en un número fijo de ensayos repetidos
bin.support = Entero en <font face=\"Consolas\">{0,1,...,n}</font>

# Cat
cat.name = Distribución Categórica
cat.desc = Una distribución de probabilidad discreta de una variable aleatoria que puede tomar uno de <font face=\"Consolas\">n</font> valores posibles
cat.params = Vector fila de tamaño <font face=\"Consolas\">n</font> que contiene probabilidades de eventos (números reales en <font face=\"Consolas\">[0,1]</font>) que suman <font face=\"Consolas\">1,0</font>
cat.support = Entero en <font face=\"Consolas\">{0,1,...,n-1}</font>

# Cauchy
cauchy.name = Distribución de Cauchy
cauchy.desc = Una distribución en forma de campana con colas pesadas. <i>Nota</i>: La media y varianza están indefinidas

# ChiSq
chiSq.name = Distribución Chi-cuadrado
chiSq.desc = Distribución de la suma de cuadrados de <font face=\"Consolas\">k</font> variables normales estándar independientes

# Dir
dir.name = Distribución de Dirichlet
dir.desc = Una generalización multivariada de la distribución Beta
dir.params = Vector fila de parámetros de concentración (Números reales <font face=\"Consolas\">>0</font>)
dir.sample = Devuelve un vector aleatorio (vector fila de medias en caso base) de la distribución de Dirichlet
dir.mean = Devuelve un vector fila de medias de la distribución de Dirichlet
dir.var = Devuelve la matriz de covarianza de la distribución de Dirichlet
dir.pdf = Devuelve el valor de la FDP de Dirichlet en <font face=\"Consolas\"><b>x</b></font> donde <font face=\"Consolas\"><b>x</b></font> contiene números reales en <font face=\"Consolas\">(0,1)</font> que suman <font face=\"Consolas\">1,0</font>

# DUnif
dunif.name = Distribución Uniforme Discreta
dunif.desc = Usada para modelar una distribución discreta donde todos los valores son igualmente probables
dunif.min = Valor mínimo, inclusivo (entero)
dunif.max = Valor máximo, inclusivo (entero)
dunif.support = Entero en <font face=\"Consolas\">{a,a+1,...,b}</font>

# Expo
expo.name = Distribución Exponencial
expo.desc = Usada para modelar el tiempo entre eventos con una tasa promedio constante
expo.param = Tasa promedio de eventos (<font face=\"Consolas\">>0</font>)

# Gamma
gamma.name = Distribución Gamma
gamma.desc = Una distribución continua que produce números reales positivos

# Geom
geom.name = Distribución Geométrica
geom.desc = Usada para modelar el número de éxitos que ocurren antes del primer fracaso
geom.support = Entero en <font face=\"Consolas\">{0,1,...}</font>

# Gumbel
gumbel.name = Distribución de Gumbel
gumbel.desc = Usada para modelar la distribución de los extremos (máx/mín) de un número de muestras de varias distribuciones

# HalfCauchy
halfCauchy.name = Distribución Semi-Cauchy
halfCauchy.desc = Semi-Cauchy positiva. <i>Nota</i>: La media y varianza están indefinidas

# HalfNorm
halfNorm.name = Distribución Semi-Normal
halfNorm.desc = Semi-Normal positiva
halfNorm.param = Desviación estándar <font face=\"Consolas\">>0</font>

# HGeom
hgeom.name = Distribución Hipergeométrica
hgeom.desc = Usada para modelar el número de éxitos en un número fijo de extracciones sin reposición
hgeom.w = Número de éxitos posibles (Entero <font face=\"Consolas\">>0</font>)
hgeom.b = Número de otros resultados posibles (Entero <font face=\"Consolas\">>0</font>)
hgeom.n = Número de extracciones (Entero <font face=\"Consolas\">>0</font>)
hgeom.support = Entero en <font face=\"Consolas\">{0,1,...,<i>mín</i>(w,n)}</font>

# Laplace
laplace.name = Distribución de Laplace
laplace.desc = Una distribución continua que puede pensarse como dos distribuciones Exponenciales puestas espalda con espalda

# Logistics
logistic.name = Distribución Logística
logistic.desc = Una distribución continua que se asemeja a la distribución Normal en forma pero tiene colas más pesadas

# LogNorm
logNorm.name = Distribución Log-Normal
logNorm.desc = Una distribución continua de una variable aleatoria cuyo logaritmo sigue una distribución Normal

# Multi
multi.name = Distribución Multinomial
multi.desc = Una generalización de la distribución Binomial a múltiples categorías
multi.p = Vector fila que contiene probabilidades de eventos (Números reales en <font face=\"Consolas\">[0,1]</font> que suman <font face=\"Consolas\">1,0</font>)
multi.sample = Devuelve un vector aleatorio (vector fila de medias en caso base) de la distribución Multinomial
multi.mean = Devuelve un vector fila de medias de la distribución Multinomial
multi.var = Devuelve la matriz de covarianza de la distribución Multinomial

# MvNorm
mvNorm.name = Distribución Normal Multivariada
mvNorm.desc = Una distribución normal multivariada
mvNorm.mu = Media (vector columna)
mvNorm.sigma = Matriz de covarianza (simétrica definida positiva)
mvNorm.sample = Devuelve un vector aleatorio (<font face=\"Consolas\"><b>\u03BC</b></font> en caso base) de la distribución Normal Multivariada. Vector columna de números reales
mvNorm.pdf = Devuelve el valor de la FDP Normal Multivariada en <font face=\"Consolas\"><b>X</b></font> (vector columna)

# NBin
nbin.name = Distribución Binomial Negativa
nbin.desc = Usada para modelar el número de éxitos que ocurren entre ensayos repetidos antes de que ocurra un número especificado de fracasos
nbin.r = Número de fracasos hasta que se detienen los ensayos (Entero <font face=\"Consolas\">\u22650</font>)

# Norm
norm.name = Distribución Normal
norm.desc = Distribución canónica en forma de campana

# Pareto
pareto.name = Distribución de Pareto
pareto.desc = Una distribución de probabilidad de ley de potencia
pareto.scale = Escala (<font face=\"Consolas\">>0</font>) valor mínimo posible de <font face=\"Consolas\">x</font>
pareto.shape = Forma (<font face=\"Consolas\">>0</font>) índice de Pareto

# PERT
pert.name = Distribución PERT (Técnica de Evaluación y Revisión de Programas)
pert.desc = El método PERT convierte una distribución Triangular a una distribución con forma Beta. A menudo se usa en análisis de riesgo para modelar estimaciones subjetivas
pert.min = Valor mínimo, inclusivo
pert.mode = Moda (valor más probable)
pert.max = Valor máximo, exclusivo
pert.support = Número real en <font face=\"Consolas\">[a,c)</font>

# Pois
pois.name = Distribución de Poisson
pois.desc = Usada para modelar el número de eventos que ocurren en un intervalo fijo de tiempo/espacio con una tasa promedio constante
pois.lambda = Número promedio de eventos en el intervalo (<font face=\"Consolas\">>0</font>)

# StudentT
student.mean_undefined = La media está indefinida para <font face=\"Consolas\">\u03BD\u22641</font>
student.var_undefined = La varianza está indefinida para <font face=\"Consolas\">\u03BD\u22641</font>
student.name = Distribución t de Student
student.desc = Una distribución en forma de campana centrada en <font face=\"Consolas\">0</font>

# Tri
tri.name = Distribución Triangular
tri.desc = Una distribución simple para modelar los valores mínimo, más probable y máximo de una variable aleatoria

# TruncNorm
truncNorm.name = Distribución Normal Truncada
truncNorm.desc = Una distribución normal acotada por valores mín/máx
truncNorm.support = Número real en <font face=\"Consolas\">[a,b]</font>

# Unif
unif.name = Distribución Uniforme
unif.desc = Usada para modelar una distribución continua donde todos los valores son igualmente probables
unif.support = Número real en <font face=\"Consolas\">[a,b)</font>

# Weibull
weibull.name = Distribución de Weibull
weibull.desc = A menudo usada para modelar tiempo hasta falla

# Zipf
zipf.name = Distribución de Zipf
zipf.desc = Usada para modelar distribuciones discretas de ley de potencia
zipf.s = Exponente (Número real <font face=\"Consolas\">>0</font>)
zipf.n = Número de elementos (Entero <font face=\"Consolas\">\u22651</font>)
zipf.support = Entero en <font face=\"Consolas\">{1,2,...,n}</font>